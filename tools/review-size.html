<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Our World — responsive review</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#5d2f43;color:#fff2df;font:700 14px system-ui,sans-serif}
    #label{position:fixed;z-index:2;top:8px;left:50%;transform:translateX(-50%);padding:5px 10px;background:#8e3a57;border:2px solid #fff2df}
    #stage{width:100%;height:100%;display:grid;place-items:center}
    #frame{transform-origin:top left;border:3px solid #fff2df;background:#fbebd6}
  </style>
</head>
<body>
  <div id="label"></div>
  <div id="stage"><iframe id="frame" title="Responsive preview" src="branch-preview.html"></iframe></div>
  <script>
    var q = new URLSearchParams(location.search), w = Math.max(320, +(q.get('w') || 360)), h = Math.max(320, +(q.get('h') || 640));
    var frame = document.getElementById('frame'), scale = Math.min((innerWidth - 30) / w, (innerHeight - 64) / h, 1);
    frame.width = w; frame.height = h; frame.style.transform = 'scale(' + scale + ')';
    frame.parentNode.style.width = (w * scale) + 'px'; frame.parentNode.style.height = (h * scale) + 'px';
    document.getElementById('label').textContent = w + ' × ' + h + ' viewport';
  </script>
</body>
</html>
